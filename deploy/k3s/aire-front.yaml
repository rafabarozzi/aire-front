apiVersion: v1
kind: Namespace
metadata:
  name: aire
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aire-front-data
  namespace: aire
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aire-front
  namespace: aire
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aire-front
  template:
    metadata:
      labels:
        app: aire-front
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: front
          image: aire-front:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: aire-front-config
          env:
            - name: AIRE_MODE
              value: live
            - name: AIRE_APP_ORIGIN
              value: https://aire.northeia.com
            - name: AIRE_DATA_DIR
              value: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /app/.next-node/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aire-front-data
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aire-front
  namespace: aire
spec:
  selector:
    app: aire-front
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aire-front
  namespace: aire
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [aire.northeia.com]
      secretName: aire-front-tls
  rules:
    - host: aire.northeia.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aire-front
                port:
                  number: 3000
