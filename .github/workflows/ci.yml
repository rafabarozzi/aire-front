name: Frontend validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build:node
      - run: docker build --tag aire-front:ci .
      - name: Check container health and closed authentication
        run: |
          docker run -d --name aire-front-ci -p 127.0.0.1:3000:3000 aire-front:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/console/journeys)" = "401"
          docker rm -f aire-front-ci
